[project]
name = "flight-tracker-lima"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "amadeus==12.0.0",
    "google-search-results==2.4.2",
    "supabase==2.9.1",
    "pandas==2.2.3",
    "numpy==2.1.3",
    "pyyaml==6.0.2",
    "tenacity==9.0.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
