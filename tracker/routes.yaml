defaults:
  search_window_days: [60]
  flex_days: 3
  trip_duration_days: [14]
  multi_stop_enabled: false
  hubs: [PTY, BOG, MIA, GRU, MEX, SCL]

destinations:
  - code: MAD
    label: Madrid
    multi_stop_min_savings_pct: 15
    preferred_hubs: [BOG, PTY, MIA]

  - code: COR
    label: Córdoba
    multi_stop_enabled: false

  - code: AUA
    label: Aruba
